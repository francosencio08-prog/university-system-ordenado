spring.application.name=university-system

# ---- Base de datos SQL Server ----
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:UniversitySystem};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# update = Hibernate crea/ajusta las tablas solo (la BD debe existir: db/01_create_database.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Gemini (opcional). Sin clave, la app arranca y las recomendaciones quedan en FAILED ----
gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6LqtZkAvU-9fUVJv_crkdStqULCVc10ogEY55MTJCeRfw}
